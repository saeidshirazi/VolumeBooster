name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build:all
      - run: npm run lint:firefox
      - run: npm run package
      - run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeBooster-all-browsers
          path: release/local/v*/*

  browser:
    name: Native ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chrome, os: windows-latest }
          - { browser: edge, os: windows-latest }
          - { browser: brave, os: windows-latest }
          - { browser: firefox, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - if: matrix.browser == 'chrome'
        run: npx playwright install chromium
      - if: matrix.browser == 'firefox'
        run: npx playwright install --with-deps firefox
      - name: Provide a virtual audio output for Firefox CI
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=VolumeBoosterTest
          pactl set-default-sink VolumeBoosterTest
      - if: matrix.browser == 'brave'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'volumebooster-brave.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'volumebooster-brave'
          gh release download --repo brave/brave-browser --pattern 'brave-v*-win32-x64.zip' --output $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $binary = Get-ChildItem -LiteralPath $folder -Filter brave.exe -Recurse -File | Select-Object -First 1
          if (!$binary) { throw 'Brave executable missing from official release archive' }
          "VOLUMEBOOSTER_BRAVE_BINARY=$($binary.FullName)" >> $env:GITHUB_ENV
      - if: matrix.browser != 'firefox'
        run: node tests/browser.mjs --browser=${{ matrix.browser }} --headless
      - if: matrix.browser == 'firefox'
        run: npm run test:firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/${{ matrix.browser }}/
